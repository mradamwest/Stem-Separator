name: Engine Foundation

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  engine:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install exact project dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify dependency imports
        shell: powershell
        run: |
          python -c "import torch, torchaudio, demucs; print(torch.__version__, torchaudio.__version__)"
      - name: Run foundation tests
        shell: powershell
        run: python -m pytest -q
