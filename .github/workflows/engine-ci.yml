name: Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build packaged application
        shell: powershell
        run: .\build_windows.ps1
      - name: Run packaged runtime self-test
        shell: powershell
        run: |
          $p = Start-Process ".\dist\StemSeparator\StemSeparator.exe" -ArgumentList "--runtime-self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged runtime self-test failed with exit code $($p.ExitCode)" }
      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc "installer\StemSeparator.iss"
          if (!(Test-Path "dist-installer\Stem_Separator_Setup_0.1.0.exe")) { throw "Installer missing" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Stem-Separator-Windows
          path: dist-installer/Stem_Separator_Setup_0.1.0.exe
          if-no-files-found: error
