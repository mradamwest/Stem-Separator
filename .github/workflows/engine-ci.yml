name: Runner Probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Confirm Windows runner allocation
        shell: powershell
        run: |
          Write-Host "Runner allocated successfully"
          Write-Host $env:RUNNER_OS
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion
