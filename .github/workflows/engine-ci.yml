name: Actions Sanity Check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/engine-ci.yml'

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Runner heartbeat
        run: echo "GitHub-hosted Actions runner is available"
