name: Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build packaged application
        shell: powershell
        run: .\build_windows.ps1
      - name: Run packaged runtime self-test
        shell: powershell
        run: |
          $exe = ".\\dist\\StemSeparator\\StemSeparator.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "stem-runtime-self-test.out"
          $stderr = Join-Path $env:RUNNER_TEMP "stem-runtime-self-test.err"
          Remove-Item $stdout,$stderr -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList "--runtime-self-test" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $progress = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "no stdout" }
            $errors = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "no stderr" }
            throw "Packaged runtime self-test timed out after 180 seconds. Progress: $progress Errors: $errors"
          }
          $p.WaitForExit()
          $p.Refresh()
          $exitCode = $p.ExitCode
          if ($null -eq $exitCode) { throw "Packaged runtime self-test finished but PowerShell did not expose an exit code." }
          $progress = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "no stdout" }
          $errors = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "no stderr" }
          if ($exitCode -ne 0) { throw "Packaged runtime self-test failed with exit code $exitCode. Progress: $progress Errors: $errors" }
      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc "installer\StemSeparator.iss"
          if (!(Test-Path "dist-installer\Stem_Separator_Setup_0.1.0.exe")) { throw "Installer missing" }
      - name: Validate installed application and uninstaller
        shell: powershell
        run: |
          $installer = (Resolve-Path ".\\dist-installer\\Stem_Separator_Setup_0.1.0.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "StemSeparatorInstalled"
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "Stem Separator.lnk"
          $startShortcut = Join-Path $env:APPDATA "Microsoft\\Windows\\Start Menu\\Programs\\Stem Separator.lnk"
          $p = Start-Process $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed with exit code $($p.ExitCode)" }
          $exe = Join-Path $installDir "StemSeparator.exe"
          if (!(Test-Path $exe)) { throw "Installed executable missing" }
          $p = Start-Process $exe -ArgumentList "--runtime-self-test" -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Installed runtime self-test timed out after 180 seconds"
          }
          if ($p.ExitCode -ne 0) { throw "Installed app self-test failed with exit code $($p.ExitCode)" }
          if (!(Test-Path $desktopShortcut)) { throw "Desktop shortcut missing after install" }
          if (!(Test-Path $startShortcut)) { throw "Start Menu shortcut missing after install" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller executable missing" }
          $p = Start-Process $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($p.ExitCode)" }
          if (Test-Path $exe) { throw "Application executable remains after uninstall" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Stem-Separator-Windows
          path: dist-installer/Stem_Separator_Setup_0.1.0.exe
          if-no-files-found: error
