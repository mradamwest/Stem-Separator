[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-separator"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "demucs==4.0.1",
  # Demucs 4.0.1 upstream declares torchaudio <2.1 on Windows.
  # Keep Torch/Torchaudio matched instead of the previously incompatible 2.5.1 pair.
  "torch==2.0.1",
  "torchaudio==2.0.2",
  # Torch 2.0.1 / TorchAudio 2.0.2 were built against NumPy 1.x; NumPy 2 breaks the ABI.
  "numpy<2",
  "PySide6==6.8.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.16.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
stem-separator = "stem_separator.ui:main"
