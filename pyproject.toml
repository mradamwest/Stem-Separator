[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-separator"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "demucs==4.1.0",
  # Demucs 4.1.0 requires torch>=2.1 on Windows; keep Torch/TorchAudio matched.
  "torch==2.1.2",
  "torchaudio==2.1.2",
  # Keep NumPy on 1.x for broad compatibility with this packaged Torch stack.
  "numpy<2",
  "PySide6==6.8.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.16.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
stem-separator = "stem_separator.ui:main"
