[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-separator"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "demucs==4.0.1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
